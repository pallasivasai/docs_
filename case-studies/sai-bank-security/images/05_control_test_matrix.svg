<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560"><rect width="980" height="560" fill="white"/><style>text{font-family:Arial;fill:#172033}.muted{fill:#667085}.good{fill:#16a34a}.bad{fill:#dc2626}</style><text x="40" y="45" font-size="25" font-weight="bold">Deterministic control-test fixtures</text><text x="40" y="72" class="muted" font-size="13">Expected synthetic outcomes, not empirically measured attack prevention</text><g font-size="12"><text x="320" y="135" text-anchor="end">Atomic transfer / race-condition</text><text x="320" y="190" text-anchor="end">Duplicate reversal</text><text x="320" y="245" text-anchor="end">24-hour recovery eligibility</text><text x="320" y="300" text-anchor="end">Cross-account authorization</text><text x="320" y="355" text-anchor="end">Hijacked session</text><text x="320" y="410" text-anchor="end">Credential stuffing</text><text x="320" y="465" text-anchor="end">Replay / idempotency</text></g><g class="good"><rect x="340" y="115" width="380" height="25" rx="3"/><rect x="340" y="170" width="380" height="25" rx="3"/><rect x="340" y="225" width="380" height="25" rx="3"/><rect x="340" y="280" width="380" height="25" rx="3"/></g><g class="bad"><rect x="340" y="335" width="380" height="25" rx="3"/><rect x="340" y="390" width="380" height="25" rx="3"/><rect x="340" y="445" width="380" height="25" rx="3"/></g><g font-size="12" font-weight="bold"><text x="740" y="134">1,000 / 1,000</text><text x="740" y="189">1,000 / 1,000</text><text x="740" y="244">1,000 / 1,000</text><text x="740" y="299">1,000 / 1,000*</text><text x="740" y="354">0 / 1,000</text><text x="740" y="409">0 / 1,000</text><text x="740" y="464">0 / 1,000</text></g><text x="40" y="525" class="muted" font-size="12">*Cross-account fixture assumes intended RLS policies are deployed and invoked.</text></svg>