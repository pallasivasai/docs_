<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">SAI Bank fintech security research dashboard</title><desc id="d">Executive summary dashboard separating repository evidence, synthetic experiment data, scenario coverage classifications, and unassessed production outcomes.</desc>
<rect width="1400" height="900" fill="#f7f9fc"/>
<text x="70" y="70" font-family="Arial" font-size="36" font-weight="700" fill="#15243a">SAI BANK | SECURITY RESEARCH SNAPSHOT</text>
<text x="70" y="108" font-family="Arial" font-size="18" fill="#58677d">24-hour wrong-payment recovery • transaction integrity • repository evidence review</text>
<rect x="70" y="145" width="1260" height="112" rx="18" fill="#eaf1fb" stroke="#b7c8df"/>
<text x="100" y="188" font-family="Arial" font-size="19" font-weight="700" fill="#183b63">RESEARCH QUESTION</text>
<text x="100" y="225" font-family="Arial" font-size="22" fill="#183b63">Can database-level controls make internal transfers safer and provide a controlled path to recover eligible wrong payments?</text>
<g font-family="Arial">
<rect x="70" y="295" width="285" height="150" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="95" y="335" font-size="16" font-weight="700" fill="#526176">SYNTHETIC TRANSFERS</text><text x="95" y="400" font-size="48" font-weight="700" fill="#17365d">40,000</text><text x="95" y="428" font-size="14" fill="#667085">Generated records • fixed seed</text>
<rect x="385" y="295" width="285" height="150" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="410" y="335" font-size="16" font-weight="700" fill="#526176">SYNTHETIC ACCOUNTS</text><text x="410" y="400" font-size="48" font-weight="700" fill="#17365d">2,500</text><text x="410" y="428" font-size="14" fill="#667085">Fictional account identifiers</text>
<rect x="700" y="295" width="285" height="150" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="725" y="335" font-size="16" font-weight="700" fill="#526176">PLANTED LABELS</text><text x="725" y="400" font-size="48" font-weight="700" fill="#17365d">2,412</text><text x="725" y="428" font-size="14" fill="#667085">6.03% by generator design</text>
<rect x="1015" y="295" width="315" height="150" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="1040" y="335" font-size="16" font-weight="700" fill="#526176">SIMULATED NOTIONAL</text><text x="1040" y="400" font-size="48" font-weight="700" fill="#17365d">₹45.43L</text><text x="1040" y="428" font-size="14" fill="#667085">Not actual fraud loss or recovery</text>
<text x="70" y="510" font-size="22" font-weight="700" fill="#15243a">Repository control-evidence mapping</text>
<rect x="70" y="535" width="395" height="155" rx="16" fill="#e8f5ed" stroke="#27834a"/><text x="100" y="580" font-size="18" font-weight="700" fill="#14532d">MITIGATES</text><text x="100" y="635" font-size="48" font-weight="700" fill="#14532d">3 / 12</text><text x="100" y="665" font-size="15" fill="#14532d">Named scenarios with relevant code evidence</text>
<rect x="500" y="535" width="395" height="155" rx="16" fill="#fff5df" stroke="#c88719"/><text x="530" y="580" font-size="18" font-weight="700" fill="#704600">PARTIAL / REVIEW</text><text x="530" y="635" font-size="48" font-weight="700" fill="#704600">4 / 12</text><text x="530" y="665" font-size="15" fill="#704600">Some evidence; audit or additional controls needed</text>
<rect x="930" y="535" width="400" height="155" rx="16" fill="#fff0ed" stroke="#c65b45"/><text x="960" y="580" font-size="18" font-weight="700" fill="#8b2c1c">NOT EVIDENCED</text><text x="960" y="635" font-size="48" font-weight="700" fill="#8b2c1c">5 / 12</text><text x="960" y="665" font-size="15" fill="#8b2c1c">No dedicated control found in inspected app code</text>
<rect x="70" y="730" width="1260" height="110" rx="16" fill="#fff" stroke="#cbd5e1"/>
<text x="100" y="770" font-size="18" font-weight="700" fill="#15243a">EVIDENCE BOUNDARIES</text>
<text x="100" y="803" font-size="16" fill="#475467">Code review = implementation evidence • Synthetic data = scenario exploration • Fixtures = assumptions, not executed tests • Production efficacy = not assessed</text>
<text x="70" y="875" font-size="13" fill="#667085">This dashboard is descriptive research, not a security certification, fraud-block rate, or investment-performance claim.</text>
</g></svg>