<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400"><rect width="980" height="400" fill="white"/><style>text{font-family:Arial;fill:#172033}.muted{fill:#667085}</style><text x="40" y="45" font-size="25" font-weight="bold">SAI Bank: 24-hour wrong-payment recovery</text><text x="40" y="72" class="muted" font-size="13">Conceptual flow described by the database procedure</text><g fill="#f5f8ff" stroke="#2563eb" stroke-width="2"><rect x="28" y="155" width="160" height="115" rx="12"/><rect x="218" y="155" width="160" height="115" rx="12"/><rect x="408" y="155" width="160" height="115" rx="12"/><rect x="598" y="155" width="160" height="115" rx="12"/><rect x="788" y="155" width="160" height="115" rx="12"/></g><g text-anchor="middle"><g font-size="16" font-weight="bold"><text x="108" y="195">Transfer</text><text x="298" y="195">0–24 hours</text><text x="488" y="195">Recovery</text><text x="678" y="195">Deficit?</text><text x="868" y="195">Future credits</text></g><g font-size="12"><text x="108" y="227">Atomic debit + credit</text><text x="298" y="227">Authenticate + ownership</text><text x="488" y="227">Lock both accounts</text><text x="678" y="227">Freeze recipient</text><text x="868" y="227">Clear deficit</text></g></g><g stroke="#344054" stroke-width="2" fill="none"><path d="M190 212h24m-8 -7l8 7 -8 7 M380 212h24m-8 -7l8 7 -8 7 M570 212h24m-8 -7l8 7 -8 7 M760 212h24m-8 -7l8 7 -8 7"/></g><text x="490" y="335" text-anchor="middle" class="muted" font-size="13">A negative balance can trigger a freeze until future credits clear the deficit.</text></svg>