<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Atomic transfer and ledger sequence</title><desc id="d">Authenticated request enters a database function. The function validates and locks accounts, updates both balances, writes linked debit and credit ledger rows, then commits all changes together or rolls back.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#425466"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="600" y="48" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#172b4d">One database transaction keeps money and ledger in sync</text>
<g font-family="Arial" text-anchor="middle">
<rect x="40" y="150" width="175" height="115" rx="13" fill="#eaf2ff" stroke="#3973ac" stroke-width="2"/><text x="127" y="190" font-size="19" font-weight="700" fill="#17365d">Client request</text><text x="127" y="222" font-size="15" fill="#17365d">Authenticated user</text>
<rect x="265" y="150" width="175" height="115" rx="13" fill="#f2edff" stroke="#7654a6" stroke-width="2"/><text x="352" y="190" font-size="19" font-weight="700" fill="#43266d">Validate</text><text x="352" y="222" font-size="15" fill="#43266d">Amount • ownership</text>
<rect x="490" y="150" width="175" height="115" rx="13" fill="#fff3df" stroke="#c88719" stroke-width="2"/><text x="577" y="190" font-size="19" font-weight="700" fill="#704600">Lock accounts</text><text x="577" y="222" font-size="15" fill="#704600">Check funds/state</text>
<rect x="715" y="150" width="190" height="115" rx="13" fill="#e8f5ed" stroke="#27834a" stroke-width="2"/><text x="810" y="190" font-size="19" font-weight="700" fill="#14532d">Update balances</text><text x="810" y="222" font-size="15" fill="#14532d">Debit A • credit B</text>
<rect x="955" y="150" width="205" height="115" rx="13" fill="#e8f5ed" stroke="#27834a" stroke-width="2"/><text x="1057" y="190" font-size="19" font-weight="700" fill="#14532d">Write ledger</text><text x="1057" y="222" font-size="15" fill="#14532d">Linked debit + credit</text>
<path d="M215 207H257M440 207H482M665 207H707M905 207H947" stroke="#425466" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M1057 265V335H600V375" stroke="#425466" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="390" y="375" width="420" height="90" rx="14" fill="#e8f5ed" stroke="#27834a" stroke-width="2"/><text x="600" y="412" font-size="22" font-weight="700" fill="#14532d">COMMIT together</text><text x="600" y="442" font-size="16" fill="#14532d">All balance + ledger changes succeed</text>
<path d="M352 265V315H190V375" stroke="#b5473a" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="375" width="270" height="90" rx="14" fill="#fff0ed" stroke="#c65b45" stroke-width="2"/><text x="190" y="412" font-size="21" font-weight="700" fill="#8b2c1c">Reject / rollback</text><text x="190" y="442" font-size="15" fill="#8b2c1c">No partial money movement</text>
</g><text x="600" y="520" font-family="Arial" font-size="15" text-anchor="middle" fill="#667085">Conceptual sequence based on the inspected transfer procedure; deployment and all alternate routes still require verification.</text></svg>