<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Wrong payment problem and SAI Bank recovery workflow</title><desc id="d">A sender makes a mistaken transfer. Within 24 hours the system authenticates and checks eligibility, locks accounts, posts compensating ledger entries, and freezes a recipient account if recovery creates a deficit until future credits clear it.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#425466"/></marker></defs>
<rect width="1200" height="650" fill="#fff"/><text x="600" y="48" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#172b4d">The wrong-payment problem → controlled recovery</text>
<g font-family="Arial" text-anchor="middle">
<rect x="45" y="105" width="220" height="100" rx="14" fill="#eaf2ff" stroke="#3973ac" stroke-width="2"/><text x="155" y="143" font-size="20" font-weight="700" fill="#17365d">1. Mistaken transfer</text><text x="155" y="173" font-size="16" fill="#17365d">A sends ₹5,000 to B</text>
<rect x="330" y="105" width="220" height="100" rx="14" fill="#fff3df" stroke="#c88719" stroke-width="2"/><text x="440" y="143" font-size="20" font-weight="700" fill="#704600">2. Problem discovered</text><text x="440" y="173" font-size="16" fill="#704600">Sender requests recovery</text>
<rect x="615" y="105" width="245" height="100" rx="14" fill="#e8f5ed" stroke="#27834a" stroke-width="2"/><text x="737" y="143" font-size="20" font-weight="700" fill="#14532d">3. Eligibility checks</text><text x="737" y="173" font-size="16" fill="#14532d">Identity • ownership • 24h</text>
<rect x="925" y="105" width="230" height="100" rx="14" fill="#e8f5ed" stroke="#27834a" stroke-width="2"/><text x="1040" y="143" font-size="20" font-weight="700" fill="#14532d">4. Atomic reversal</text><text x="1040" y="173" font-size="16" fill="#14532d">Lock • ledger • commit</text>
<path d="M265 155H322M550 155H607M860 155H917" stroke="#425466" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M1040 205V280H750V320" stroke="#425466" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="530" y="320" width="440" height="100" rx="14" fill="#f2edff" stroke="#7654a6" stroke-width="2"/><text x="750" y="358" font-size="21" font-weight="700" fill="#43266d">Can recipient cover ₹5,000?</text><text x="750" y="390" font-size="16" fill="#43266d">Check available balance during locked update</text>
<path d="M650 420V485H335V515M850 420V485H930V515" stroke="#425466" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="480" y="472" font-size="16" fill="#14532d">YES</text><text x="875" y="472" font-size="16" fill="#9a3412">NO / deficit</text>
<rect x="155" y="515" width="360" height="90" rx="14" fill="#e8f5ed" stroke="#27834a" stroke-width="2"/><text x="335" y="551" font-size="20" font-weight="700" fill="#14532d">Recovery completed</text><text x="335" y="580" font-size="16" fill="#14532d">B debited • A credited • audit trail</text>
<rect x="735" y="515" width="390" height="90" rx="14" fill="#fff0ed" stroke="#c65b45" stroke-width="2"/><text x="930" y="551" font-size="20" font-weight="700" fill="#8b2c1c">Freeze while deficit remains</text><text x="930" y="580" font-size="16" fill="#8b2c1c">Future incoming credits clear deficit</text>
</g><text x="600" y="635" font-family="Arial" font-size="13" text-anchor="middle" fill="#667085">Illustrative internal-ledger workflow; external payment rails are not guaranteed to be reversible.</text></svg>