<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#f7f9fc"/>
<text x="48" y="54" font-family="Arial" font-size="29" font-weight="700" fill="#172033">SAI Bank | Threat coverage &amp; defense roadmap</text>
<text x="48" y="83" font-family="Arial" font-size="14" fill="#667085">12 predefined threat scenarios • Repository review + proposed control plan</text>
<g font-family="Arial">
<rect x="48" y="112" width="480" height="330" rx="14" fill="#fff" stroke="#dbe2ea"/>
<text x="76" y="151" font-size="19" font-weight="700" fill="#172033">Current code-review evidence</text>
<rect x="76" y="183" width="105" height="30" rx="5" fill="#16a34a"/><text x="128" y="203" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">3 mitigated</text>
<rect x="181" y="183" width="140" height="30" rx="5" fill="#f59e0b"/><text x="251" y="203" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">4 partial</text>
<rect x="321" y="183" width="175" height="30" rx="5" fill="#dc2626"/><text x="408" y="203" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">5 not evidenced</text>
<text x="76" y="260" font-size="42" font-weight="700" fill="#172033">25%</text><text x="76" y="286" font-size="13" fill="#667085">Direct mitigation evidence in reviewed code</text>
<text x="76" y="337" font-size="14" fill="#344054">3 / 12 scenarios mapped as mitigated</text>
<text x="76" y="365" font-size="14" fill="#344054">4 / 12 partial or require review</text>
<text x="76" y="393" font-size="14" fill="#344054">5 / 12 without specific app-code evidence</text>
<rect x="572" y="112" width="480" height="330" rx="14" fill="#fff" stroke="#dbe2ea"/>
<text x="600" y="151" font-size="19" font-weight="700" fill="#172033">Proposed defense roadmap</text>
<rect x="600" y="183" width="424" height="30" rx="5" fill="#2563eb"/>
<text x="812" y="203" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">12 scenarios assigned a workstream</text>
<text x="600" y="260" font-size="42" font-weight="700" fill="#172033">12 / 12</text>
<text x="600" y="286" font-size="13" fill="#667085">100% planning coverage — proposed, not deployed</text>
<text x="600" y="337" font-size="14" fill="#344054">Every scenario has a recommended control path</text>
<text x="600" y="365" font-size="14" fill="#344054">Implementation and independent testing remain</text>
<text x="600" y="393" font-size="14" fill="#344054">necessary before efficacy can be measured</text>
<rect x="48" y="470" width="1004" height="105" rx="12" fill="#fff" stroke="#dbe2ea"/>
<text x="76" y="507" font-size="17" font-weight="700" fill="#172033">Attack-prevention rate: NOT MEASURED</text>
<text x="76" y="538" font-size="14" fill="#475467">12/12 means roadmap mapping only. It does not mean all attacks—or 100% of these scenarios—are prevented.</text>
<text x="48" y="615" font-size="12" fill="#667085">Evidence scope: inspected application repository files. No production telemetry, executed penetration test or independent audit is represented.</text>
</g></svg>